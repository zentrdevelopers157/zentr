<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zentr | Create Store</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            padding: 40px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .header {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .header img {
            height: 32px;
            border-radius: 6px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 32px 24px;
            box-sizing: border-box;
        }

        .success-box {
            display: none;
            text-align: center;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .link-group {
            margin-top: 24px;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .link-item {
            margin-bottom: 16px;
        }

        .link-item:last-child {
            margin-bottom: 0;
        }

        .link-item label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-row {
            display: flex;
            gap: 8px;
        }

        .copy-row input {
            flex: 1;
            min-width: 0;
            background: var(--surface);
            font-family: monospace;
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="logo.png" alt="Zentr" onerror="this.style.display='none'">
        <button class="iconbtn" onclick="location.href='index.html'" style="font-size: 0.9rem;">Back</button>
    </div>

    <div class="card glass" id="formCard">
        <h2 style="margin-top: 0; margin-bottom: 24px;">Create your store</h2>

        <div class="field">
            <label>Store Name *</label>
            <input type="text" id="storeName" placeholder="e.g. Trendy Fits">
        </div>

        <div class="field">
            <label>Your Name *</label>
            <input type="text" id="sellerName" placeholder="e.g. Jane Doe">
        </div>

        <div class="field">
            <label>WhatsApp Number *</label>
            <input type="tel" id="sellerPhone" placeholder="+91 9876543210">
        </div>

        <div class="field" style="margin-bottom: 32px;">
            <label>Category (Optional)</label>
            <input type="text" id="storeCategory" placeholder="e.g. Apparel, Electronics">
        </div>

        <button class="btn primary" id="createBtn" style="width: 100%; padding: 14px; font-size: 1.1rem;">Create
            Store</button>
    </div>

    <div class="card glass success-box" id="successCard">
        <div class="success-icon">🎉</div>
        <h2 style="margin-top: 0;">Your Zentr store is ready</h2>
        <p style="color: var(--text-muted);">Save these links carefully. You will need them to manage your store and
            accept orders.</p>

        <div class="link-group">
            <div class="link-item">
                <label>Seller Dashboard (Keep Secret)</label>
                <div class="copy-row">
                    <input type="text" id="dashLink" readonly>
                    <button class="btn" onclick="copy('dashLink')" style="padding: 0 16px;">Copy</button>
                </div>
            </div>
            <div class="link-item">
                <label>Buyer Storefront (Share with Customers)</label>
                <div class="copy-row">
                    <input type="text" id="buyerLink" readonly>
                    <button class="btn" onclick="copy('buyerLink')" style="padding: 0 16px;">Copy</button>
                </div>
            </div>
        </div>

        <button class="btn primary" id="goDashBtn"
            style="width: 100%; margin-top: 24px; padding: 14px; font-size: 1.1rem;">Go to Dashboard</button>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const $ = id => document.getElementById(id);
        let st = null;
        function showToast(msg) {
            const t = $("toast");
            t.textContent = msg;
            t.className = "toast show";
            clearTimeout(st);
            st = setTimeout(() => t.className = "toast", 3000);
        }

        async function copy(id) {
            const el = $(id);
            try {
                await navigator.clipboard.writeText(el.value);
                showToast("Copied to clipboard!");
            } catch (e) {
                el.select();
                document.execCommand('copy');
                showToast("Copied via fallback!");
            }
        }

        $("createBtn").addEventListener("click", async () => {
            const name = $("storeName").value.trim();
            const owner = $("sellerName").value.trim();
            const phone = $("sellerPhone").value.trim();
            const category = $("storeCategory").value.trim();

            if (!name || !owner || !phone) return showToast("Store Name, Your Name, and Phone are required.");

            const btn = $("createBtn");
            btn.disabled = true;
            btn.textContent = "Creating...";

            try {
                const res = await fetch("/api/onboard", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, owner, phone, category })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || "Failed to create store");

                const baseUrl = window.location.origin;
                const dashUrl = `${baseUrl}/seller.html?sellerId=${data.sellerId}&sellerKey=${data.sellerKey}`;
                const buyUrl = `${baseUrl}/buyer.html?sellerId=${data.sellerId}`;

                $("dashLink").value = dashUrl;
                $("buyerLink").value = buyUrl;

                $("goDashBtn").onclick = () => location.href = dashUrl;

                $("formCard").style.display = "none";
                $("successCard").style.display = "block";

            } catch (err) {
                showToast(err.message);
                btn.disabled = false;
                btn.textContent = "Create Store";
            }
        });
    </script>
</body>

</html>
