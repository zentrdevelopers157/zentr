<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zentr | Orders. Not DMs.</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 0 20px;
        }

        .hero-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 24px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0 0 16px 0;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn.primary {
            padding: 14px 28px;
            font-size: 1.1rem;
            background: var(--brand);
            color: #000;
            border: none;
            border-radius: 8px;
        }

        .btn.secondary {
            padding: 14px 28px;
            font-size: 1.1rem;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="glass card" style="background: transparent; border: none; box-shadow: none;">
        <img src="logo.png" alt="Zentr Logo" class="hero-logo"
            onerror="this.src='https://placehold.co/120x120?text=Z';">
        <h1>Welcome to Zentr</h1>
        <p class="tagline">Orders. Not DMs. Simplify your WhatsApp commerce with structured tracking, instant catalog
            checking, and complete end-to-end management.</p>

        <div class="cta-group">
            <button class="btn primary" onclick="location.href='create-store.html'">Start Selling</button>
        </div>
    </div>
</body>

</html>
