<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zentr · Admin Console</title>
    <style>
        :root {
            --bg0: #0a0a0a;
            --bg1: #111;
            --text: #eee;
            --muted: #aaa;
            --accent: #27f0d5;
            --accent-hover: #1cccae;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(to bottom right, var(--bg0), var(--bg1));
            color: var(--text);
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            margin: 0 0 10px;
            color: var(--accent);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .login-form {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.5);
            color: var(--text);
            flex: 1;
            max-width: 300px;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-val {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
        }

        .stat-label {
            font-size: 14px;
            color: var(--muted);
            margin-top: 5px;
        }

        .event-list {
            font-family: monospace;
            font-size: 12px;
            color: var(--muted);
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
        }

        .event-item {
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .event-item:last-child {
            border-bottom: none;
        }

        .e-type {
            color: #fff;
            font-weight: bold;
            width: 150px;
            flex-shrink: 0;
        }

        .e-time {
            color: #666;
            width: 140px;
            flex-shrink: 0;
        }

        .e-data {
            flex: 1;
            word-break: break-all;
        }

        .hidden {
            display: none !important;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Zentr Platform Admin</h1>
            <p class="muted">Owner-only analytics and health monitoring</p>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="card">
            <form class="login-form" id="loginForm">
                <input type="password" id="secretInput" autocomplete="off" required>
                <button type="submit">Unlock</button>
            </form>
            <div id="loginError" class="error"></div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden">
            <div class="card">
                <h3>Platform Stats</h3>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-val" id="valStores">0</div>
                        <div class="stat-label">Total Stores</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="valProducts">0</div>
                        <div class="stat-label">Total Products</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="valOrders">0</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="valRevenue">₹0</div>
                        <div class="stat-label">Gross Revenue</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin:0">Recent Events</h3>
                    <button onclick="fetchStats()" style="padding: 5px 10px; font-size: 12px;">Refresh</button>
                </div>
                <div class="event-list" id="eventList">
                    <!-- Events injected here -->
                </div>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button onclick="logout()"
                    style="background: transparent; color: var(--muted); border: 1px solid var(--border);">Lock
                    Down</button>
            </div>
        </div>

    </div>

    <script>
        const el = id => document.getElementById(id);
        let currentSecret = localStorage.getItem("zentr_admin_secret") || "";

        el("loginForm").onsubmit = (e) => {
            e.preventDefault();
            currentSecret = el("secretInput").value.trim();
            localStorage.setItem("zentr_admin_secret", currentSecret);
            fetchStats();
        };

        function logout() {
            currentSecret = "";
            localStorage.removeItem("zentr_admin_secret");
            el("loginSection").classList.remove("hidden");
            el("dashboardSection").classList.add("hidden");
            el("secretInput").value = "";
        }

        async function fetchStats() {
            if (!currentSecret) return;

            el("loginError").textContent = "Authenticating...";

            try {
                const res = await fetch("/api/admin/stats", {
                    headers: { "x-admin-secret": currentSecret }
                });

                const data = await res.json();

                if (!res.ok || !data.ok) {
                    throw new Error(data.error || "Authentication failed");
                }

                // Success
                el("loginError").textContent = "";
                el("loginSection").classList.add("hidden");
                el("dashboardSection").classList.remove("hidden");

                // Populate stats
                el("valStores").textContent = data.stats.totalStores;
                el("valProducts").textContent = data.stats.totalProducts;
                el("valOrders").textContent = data.stats.totalOrders;
                el("valRevenue").textContent = "₹" + Number(data.stats.totalRevenue).toLocaleString("en-IN");

                // Populate events
                el("eventList").innerHTML = "";
                if (data.recentEvents.length === 0) {
                    el("eventList").innerHTML = "<div style='text-align:center'>No events tracked yet.</div>";
                } else {
                    data.recentEvents.forEach(evt => {
                        const div = document.createElement("div");
                        div.className = "event-item";

                        // Clean up metadata
                        const meta = { ...evt };
                        delete meta.id;
                        delete meta.type;
                        delete meta.timestamp;

                        div.innerHTML = `
              <div class="e-time">${new Date(evt.timestamp).toLocaleString()}</div>
              <div class="e-type">${evt.type}</div>
              <div class="e-data">${JSON.stringify(meta)}</div>
            `;
                        el("eventList").appendChild(div);
                    });
                }
            } catch (err) {
                el("loginError").textContent = err.message;
                el("loginSection").classList.remove("hidden");
                el("dashboardSection").classList.add("hidden");
            }
        }

        // Auto-login attempt if secret is stored
        if (currentSecret) {
            el("secretInput").value = currentSecret;
            fetchStats();
        }
    </script>
</body>

</html>
