<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zentr | Buyer</title>

  <!-- stops favicon 404 -->
  <link rel="icon" href="data:," />

  <style>
    :root {
      --bg0: #071114;
      --bg1: #0b1a1f;
      --glass: rgba(255, 255, 255, .08);
      --glass2: rgba(255, 255, 255, .12);
      --stroke: rgba(255, 255, 255, .16);
      --text: rgba(255, 255, 255, .92);
      --muted: rgba(255, 255, 255, .55);
      --turq: #27f0d5;
      --warn: #ffcc66;
      --ok: #4dff88;
      --bad: #ff6b6b;
      --shadow: 0 18px 55px rgba(0, 0, 0, .45);
      --shadow2: 0 10px 28px rgba(0, 0, 0, .35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(39, 240, 213, .20), transparent 60%),
        radial-gradient(900px 550px at 80% 20%, rgba(39, 240, 213, .12), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky;
      top: 0;
      backdrop-filter: blur(18px);
      background: rgba(7, 17, 20, .85);
      border-bottom: 1px solid var(--stroke);
      z-index: 20;
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .store-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
    }

    .store-brand .cat-pill {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(39, 240, 213, .15);
      color: var(--turq);
      border: 1px solid rgba(39, 240, 213, .3);
      font-weight: 600;
    }

    .search {
      flex: 1;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, .06);
      border-radius: 999px;
      padding: 10px 14px;
      box-shadow: var(--shadow2);
      transition: background 0.2s, border-color 0.2s;
    }
    .search:focus-within {
      background: rgba(255, 255, 255, .09);
      border-color: rgba(39, 240, 213, .4);
    }

    .search input {
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
      font-size: 14px;
      color: var(--text);
    }

    .search input::placeholder {
      color: var(--muted);
    }

    .cart-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid var(--stroke);
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .cart-btn:hover {
      background: rgba(255, 255, 255, .12);
    }
    .cart-btn .badge {
      background: var(--turq);
      color: #000;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
    }

    /* ── Layout ── */
    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 16px 40px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 18px;
    }

    @media (max-width: 980px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .topbar-inner {
        flex-wrap: wrap;
        padding: 12px;
      }
      .search {
        order: 3;
        max-width: 100%;
        width: 100%;
        margin-top: 4px;
      }
    }

    .glass {
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, var(--glass), rgba(0, 0, 0, .12));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .section {
      padding: 16px;
    }

    .section-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    h2,
    h3 {
      margin: 0;
      color: var(--text);
    }

    h2 {
      font-size: 18px;
    }

    p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── Product Grid ── */
    #productGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 740px) {
      #productGrid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      padding: 14px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, .06);
      border-radius: 16px;
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      transition: border-color .2s ease, background .2s ease;
    }

    @media (max-width: 400px) {
      .card {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }
      .meta { width: 100%; }
      .meta .name, .meta .price { text-align: center; }
    }

    .card:hover {
      border-color: rgba(39, 240, 213, .30);
      background: rgba(39, 240, 213, .06);
    }

    .imgbox {
      width: 120px;
      height: 120px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .15);
      overflow: hidden;
      background: rgba(0, 0, 0, .3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Gallery ── */
    .gallery {
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .gallery::-webkit-scrollbar { display: none; }

    .gallery-item {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gallery-item img, .gallery-item video, .gallery-item iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-dots {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      pointer-events: none;
      z-index: 5;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,.3);
      transition: .2s;
    }
    .dot.active {
      background: var(--turq);
      width: 10px;
      border-radius: 3px;
    }

    .imgbox img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .meta .name {
      font-weight: 700;
      margin: 2px 0;
      color: var(--text);
    }

    .meta .price {
      font-weight: 700;
      color: var(--turq);
      margin: 2px 0 8px;
    }

    .variants {
      display: grid;
      gap: 8px;
      margin: 8px 0 10px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 12px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      outline: none;
    }

    select option {
      background: #0b1a1f;
      color: var(--text);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(39, 240, 213, .35);
      cursor: pointer;
      background: rgba(39, 240, 213, .14);
      color: var(--text);
      font-weight: 700;
      transition: transform .05s ease, background .15s ease;
    }

    .btn:hover {
      background: rgba(39, 240, 213, .22);
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* ── Cart Sidebar ── */
    .cart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .cart-list {
      display: grid;
      gap: 10px;
      margin: 10px 0;
    }

    .cart-item {
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, .06);
      border-radius: 14px;
      padding: 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 400px) {
      .cart-item {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }
      .qty { justify-content: center; }
    }

    .ci-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
    }

    .ci-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty button {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, .08);
      color: var(--text);
      cursor: pointer;
      font-weight: 800;
    }

    .qty button:hover {
      background: rgba(39, 240, 213, .14);
      border-color: rgba(39, 240, 213, .35);
    }

    .sum {
      margin-top: 10px;
      border-top: 1px dashed rgba(255, 255, 255, .14);
      padding-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .sumrow {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
    }

    .sumrow strong {
      color: var(--turq);
    }

    .buyer-info {
      margin-top: 12px;
      border-top: 1px dashed rgba(255, 255, 255, .14);
      padding-top: 12px;
    }

    .input {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--stroke);
      background: rgba(255, 255, 255, .07);
      color: var(--text);
      outline: none;
      font-family: inherit;
      font-size: 14px;
      transition: border-color .15s ease;
    }

    .input::placeholder {
      color: var(--muted);
    }

    .input:focus {
      border-color: rgba(39, 240, 213, .45);
    }

    textarea.input {
      min-height: 64px;
      resize: vertical;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-primary {
      background: rgba(39, 240, 213, .18);
      border-color: rgba(39, 240, 213, .40);
    }

    .btn-primary:hover {
      background: rgba(39, 240, 213, .28);
    }

    .btn-danger {
      background: rgba(255, 107, 107, .10);
      border-color: rgba(255, 107, 107, .25);
    }

    .btn-danger:hover {
      background: rgba(255, 107, 107, .18);
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 18px;
      z-index: 999;
      background: rgba(7, 17, 20, .92);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(14px);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      max-width: min(560px, calc(100% - 24px));
      display: none;
      box-shadow: var(--shadow);
    }

    /* Zoom modal */
    #zoomOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .9);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      cursor: zoom-out;
    }

    #zoomOverlay img {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: var(--shadow);
      animation: zoomIn 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes zoomIn {
      from {
        transform: scale(0.95);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: skeleton-load 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes skeleton-load {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="store-brand" id="storeBrand">
        <span id="storeNameText">Loading...</span>
        <span id="storeCatPill" class="cat-pill" style="display:none"></span>
      </div>

      <div class="search">
        <span style="opacity:.6">🔎</span>
        <input id="searchInput" placeholder="Search products..." autocomplete="off" />
      </div>

      <a href="#cartSection" class="cart-btn">
        🛒 <span class="badge" id="cartCount">0</span>
      </a>
    </div>
  </div>

  <main class="wrap">
    <section class="glass section">
      <div class="section-title">
        <div>
          <h2>Products</h2>
        </div>
      </div>

      <div id="productGrid"></div>
    </section>

    <aside class="glass section" id="cartSection">
      <div class="cart-head">
        <div>
          <h3>Your Cart</h3>
          <p style="margin-top:4px">Live subtotal & clean checkout payload.</p>
        </div>
      </div>

      <div class="cart-list" id="cartList"></div>

      <div class="sum">
        <div class="sumrow"><span>Subtotal</span><strong id="subTotal">₹0</strong></div>
        <div class="sumrow"><span>Delivery</span><strong id="deliveryFee">₹0</strong></div>
        <div class="sumrow" style="font-size:14px"><span>Total</span><strong id="grandTotal">₹0</strong></div>
      </div>

      <div class="buyer-info">
        <h3>Delivery Information</h3>
        <div style="display:grid; gap:10px; margin-top:10px">
          <div>
            <label style="font-size:12px;color:var(--muted)">Full Name</label>
            <input class="input" id="buyerName" value="Guest Buyer" />
          </div>
          <div>
            <label style="font-size:12px;color:var(--muted)">Phone Number</label>
            <input class="input" id="buyerPhone" value="0000000000" />
          </div>
          <div>
            <label style="font-size:12px;color:var(--muted)">Delivery Address</label>
            <textarea class="input" id="buyerAddress">N/A</textarea>
          </div>
        </div>

        <div id="paymentSection" style="margin-top:16px; display:none;">
          <h3 style="font-size:14px; margin-bottom:8px; color:var(--text)">Payment Method</h3>
          <div id="paymentList" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <div class="actions" style="margin-top:16px">
          <button class="btn btn-primary" id="checkoutBtn">Place Order</button>
          <button class="btn btn-danger" id="clearCartBtn">Clear Cart</button>
        </div>

        <div class="note">
          Prototype: checkout creates an order + shows a payment instruction toast. Later: UPI intent + receipt +
          tracking.
        </div>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast"></div>

  <div id="zoomOverlay"><img src="" alt="Zoomed Product" /></div>

  <script src="./buyer.js"></script>
</body>

</html>
